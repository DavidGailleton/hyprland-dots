# ── Kitty ──  (colors.conf is generated by matugen; SIGUSR1 reloads live)
include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures never

# glass: Hyprland applies the window opacity + blur (conf/rules.lua)
background_opacity 1.0
window_padding_width 10 14
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape beam
cursor_trail 3
cursor_blink_interval 0.6

scrollback_lines 10000
copy_on_select clipboard
enable_audio_bell no
visual_bell_duration 0.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

shell fish
# remote control over a socket only (used by scripts, never by programs in the terminal)
allow_remote_control socket-only
listen_on unix:@kitty

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
