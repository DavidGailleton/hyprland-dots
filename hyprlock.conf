# hyprlock — blurred wallpaper, big clock, glass password pill.
# Colors + $wallpaper come from matugen (scripts/wallpaper.sh).
source = ~/.config/hypr/hyprlock-colors.conf

$font = Inter
$mono = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = $wallpaper
    color = $surface
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.7
    vibrancy = 0.25
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 120
    font_family = $font Bold
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $primary
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# glass card behind the input
shape {
    monitor =
    size = 380, 64
    color = rgba(0, 0, 0, 0.25)
    rounding = -1
    border_size = 0
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 64
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $primary
    inner_color = rgba(17, 20, 15, 0.55)
    font_color = $on_surface
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##c2c8bb">  $USER</span>
    check_color = $primary_fixed_dim
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $secondary
    rounding = -1
    position = 0, -60
    halign = center
    valign = center
}

# battery + layout, bottom
label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%   $LAYOUT"
    color = $on_surface_variant
    font_size = 13
    font_family = $mono
    position = 0, 40
    halign = center
    valign = bottom
}
